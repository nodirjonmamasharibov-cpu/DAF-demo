<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modelltest Lesen: Digitaler TestDaF (Übung)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700\&family=Literata:opsz,wght@7..72,400;7..72,600\&display=swap">
<style>
:root{
 --paper:#EDF1F4;--sheet:#FFFFFF;--ink:#18263A;--ink-soft:#4B5C71;--rule:#D2DBE3;--rule-strong:#A3B2C1;
 --pen:#2346A6;--on-pen:#FFFFFF;--pen-wash:#E3E9F8;
 --marker:#FFE27A;--marker-ink:#18263A;
 --alert:#B3261E;--ok:#1D7443;--ok-wash:#E1F1E7;--bad-wash:#FAE6E4;
 --scrim:rgba(12,18,26,.55);
 --font-read:"Literata",Georgia,"Times New Roman",serif;
 --font-ui:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 color-scheme:light;
 box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);
 padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
 --paper:#0E1319;--sheet:#161D25;--ink:#E3E9F0;--ink-soft:#9DAEC1;--rule:#27323F;--rule-strong:#44536A;
 --pen:#8EA8FF;--on-pen:#0B1017;--pen-wash:#1B2643;
 --marker:#6B5911;--marker-ink:#FFF4CC;
 --alert:#FF8E84;--ok:#6CD197;--ok-wash:#132C1F;--bad-wash:#361C1A;
 --scrim:rgba(0,0,0,.65);
 color-scheme:dark;
 }
}
:root[data-theme="dark"]{
 --paper:#0E1319;--sheet:#161D25;--ink:#E3E9F0;--ink-soft:#9DAEC1;--rule:#27323F;--rule-strong:#44536A;
 --pen:#8EA8FF;--on-pen:#0B1017;--pen-wash:#1B2643;
 --marker:#6B5911;--marker-ink:#FFF4CC;
 --alert:#FF8E84;--ok:#6CD197;--ok-wash:#132C1F;--bad-wash:#361C1A;
 --scrim:rgba(0,0,0,.65);
 color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--paper);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:17px;line-height:1.5}
a{color:var(--pen)}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding-left:20px;padding-right:20px}
h2{font-size:1.05rem;margin:0 0 12px}

/* Buttons */
.btn{font:inherit;font-weight:700;font-size:1rem;line-height:1.2;border-radius:4px;padding:12px 22px;border:2px solid transparent;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--pen);color:var(--on-pen)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
.btn.ghost:hover{border-color:var(--pen)}
.btn.small{padding:6px 12px;font-size:.9rem}
.mobile-only{display:none}

/* Answer-sheet bubble */
.bubble{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-strong);background:var(--sheet);margin-top:1px;transition:background-color .12s,border-color .12s}
input:checked + .bubble{background:var(--pen);border-color:var(--pen);box-shadow:inset 0 0 0 3px var(--sheet)}
input:focus-visible + .bubble{outline:3px solid var(--pen);outline-offset:2px}
.opt input,.mode-opt input,.g-cell input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

/* Start */
.start{padding-top:56px;padding-bottom:72px;max-width:860px}
.hero h1{font-family:var(--font-read);font-weight:600;font-size:clamp(2.6rem,8vw,4.4rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 18px}
.lede{font-size:1.15rem;max-width:56ch;color:var(--ink-soft);margin:0 0 44px}
.plan-list{list-style:none;padding:0;margin:0 0 44px;border-top:1px solid var(--rule)}
.plan-row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;grid-template-areas:"n name meta" "n bar bar";column-gap:12px;row-gap:8px;padding:13px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.plan-n{grid-area:n;font-family:var(--font-read);font-size:1.3rem;font-weight:600;color:var(--pen);line-height:1}
.plan-name{grid-area:name;font-weight:700}
.plan-meta{grid-area:meta;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap}
.plan-bar{grid-area:bar;height:6px;background:var(--pen-wash);border-radius:3px;overflow:hidden}
.plan-bar>span{display:block;height:100%;background:var(--pen);border-radius:3px}
.mode{margin:0 0 32px}
.mode-opt{position:relative;display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--rule);cursor:pointer;max-width:64ch}
.mode-opt:last-child{border-bottom:1px solid var(--rule)}
.mode-opt small{display:block;color:var(--ink-soft);font-size:.95rem}
.fine{font-size:.92rem;color:var(--ink-soft);max-width:64ch;margin:28px 0 0}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;padding-bottom:8px}
.tb-left{display:flex;align-items:center;gap:10px;font-size:.95rem;min-width:0}
.tb-sep{width:1px;height:16px;background:var(--rule-strong)}
.tb-right{display:flex;align-items:center;gap:12px}
.clock{font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums;min-width:4.4ch;text-align:right}
.clock.warn{color:var(--alert)}
.practice-tag{font-size:.9rem;color:var(--ink-soft)}
.track{display:flex;gap:4px;padding-bottom:10px}
.seg{flex-shrink:1;flex-basis:0;height:6px;background:var(--pen-wash);border-radius:3px;overflow:hidden}
.seg .fill{display:block;height:100%;width:0;background:var(--pen);transition:width .3s linear}
.seg.done .fill{width:100%;background:var(--rule-strong)}
.seg.now .fill{width:100%}
.seg.now.warn .fill{background:var(--alert)}

/* Task shell */
.task{padding-top:24px;padding-bottom:56px}
.task-title{font-family:var(--font-read);font-weight:600;font-size:clamp(1.45rem,3.2vw,1.95rem);letter-spacing:-.01em;line-height:1.2;margin:0 0 12px}
.instr{border-left:3px solid var(--pen);padding:2px 0 2px 14px;margin:0 0 24px;color:var(--ink-soft);max-width:72ch}
.instr p{margin:0 0 3px}
.split{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:32px;align-items:start}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:clamp(18px,3vw,34px)}
.sheet.solo{max-width:860px}
.text-title{font-family:var(--font-read);font-size:1.4rem;font-weight:600;line-height:1.25;margin:0 0 14px}
.byline{font-size:.92rem;color:var(--ink-soft);margin:-6px 0 16px}
.reading{font-family:var(--font-read);font-size:1.06rem;line-height:1.78;max-width:68ch}
.reading p{margin:0 0 1em;hyphens:auto}
.reading p:last-child{margin-bottom:0}
.pnum{font-family:var(--font-ui);font-weight:700;color:var(--pen);margin-right:3px}
.answers{padding:4px 2px}
.pane-note{color:var(--ink-soft);font-size:.95rem;margin:0 0 14px}
@media (min-width:900px){
 .answers{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);max-height:calc(100vh - 104px);max-height:calc(100dvh - 104px);overflow:auto;padding-right:10px}
}
.pane-switch{display:none}
.task-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--rule);flex-wrap:wrap}
.nav-note{color:var(--ink-soft);font-size:.92rem}

/* Questions */
.q{border-top:1px solid var(--rule);padding:16px 0 12px}
.q:first-child{border-top:0;padding-top:0}
.q-stem{font-weight:700;margin:0 0 8px;display:flex;gap:10px}
.q-n{flex:none;font-family:var(--font-read);font-weight:600;color:var(--pen);min-width:1.3em}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:8px;margin:0 -8px;border-radius:4px;cursor:pointer}
.opt:hover{background:var(--pen-wash)}
.opt:hover .bubble{border-color:var(--pen)}
.sel{width:100%;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule-strong);border-radius:4px;padding:10px 12px}

/* Gap text */
.gap{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap}
.gap-n{font-family:var(--font-ui);font-size:.75rem;font-weight:700;color:var(--pen)}
.gap select{font-family:var(--font-ui);font-size:1rem;color:var(--ink);background:var(--pen-wash);border:0;border-bottom:2px solid var(--pen);border-radius:3px 3px 0 0;padding:2px 4px;max-width:100%;cursor:pointer}

/* Ordering */
.order{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.col-h{font-size:1rem;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.slot{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:transparent;border:2px dashed var(--rule-strong);border-radius:6px;padding:12px 14px;min-height:64px;cursor:pointer}
.slot.fixed{border-style:solid;border-color:var(--rule);background:var(--sheet);cursor:default}
.slot.filled{border-style:solid;border-color:var(--pen);background:var(--sheet)}
.slot.target{border-color:var(--pen);background:var(--pen-wash)}
.slot-n{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--pen);color:var(--pen);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.slot-empty{color:var(--ink-soft);font-style:italic;align-self:center}
.reading-sm{font-family:var(--font-read);font-size:.98rem;line-height:1.62}
.hint{color:var(--ink-soft);font-size:.95rem;margin:-4px 0 12px}
.pool{display:grid;gap:10px}
.chunk{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;cursor:pointer}
.chunk:hover{border-color:var(--pen)}
.chunk.armed{outline:3px solid var(--pen);outline-offset:0;background:var(--pen-wash)}
.chunk.used{opacity:.55}
.chunk.used.armed{opacity:1}
.chunk-tag{flex:none;font-weight:700;color:var(--pen);font-family:var(--font-ui);min-width:1em}
.chunk-where{display:block;font-family:var(--font-ui);font-size:.85rem;color:var(--ink-soft);margin-top:4px}

/* Speech acts */
.marker{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding:0 .3em;border-radius:4px;background:var(--pen);color:var(--on-pen);font-family:var(--font-ui);font-weight:700;font-size:.78rem;line-height:1;vertical-align:.12em;margin-right:3px}

/* Categories */
.grow{border-top:1px solid var(--rule);padding:14px 0}
.grow:first-child{border-top:0;padding-top:0}
.g-stem{font-weight:700;display:flex;gap:10px;margin:0 0 10px}
.g-cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.g-cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;border-radius:4px;cursor:pointer;text-align:center}
.g-cell:hover{background:var(--pen-wash)}
.g-cell:hover .bubble{border-color:var(--pen)}
.g-lab{font-size:.84rem;color:var(--ink-soft);line-height:1.2}
input:checked ~ .g-lab{color:var(--ink);font-weight:700}

/* Pair */
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.pcol{border:1px solid var(--rule-strong);border-radius:6px;padding:12px;background:var(--sheet)}
.pcol-h{font-size:.95rem;margin:0;display:flex;justify-content:space-between;gap:8px}
.count{font-weight:400;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:.92rem}
.pslot{display:flex;justify-content:space-between;gap:8px;width:100%;min-height:48px;border-radius:4px;padding:8px 10px;margin-top:8px;font:inherit;font-size:.95rem;text-align:left}
.pslot.empty{border:2px dashed var(--rule);color:var(--ink-soft);font-style:italic;align-items:center}
.pslot.filled{border:2px solid var(--pen);background:var(--pen-wash);color:var(--ink);cursor:pointer}
.px{color:var(--ink-soft);flex:none}
.plist{list-style:none;padding:0;margin:0}
.pst{border-top:1px solid var(--rule);padding:12px 0}
.pst p{margin:0 0 8px}
.pst.assigned p{color:var(--ink-soft)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{font:inherit;font-size:.9rem;font-weight:700;padding:6px 14px;border-radius:4px;border:1px solid var(--rule-strong);background:transparent;color:var(--ink);cursor:pointer}
.pbtn:hover{border-color:var(--pen)}
.pbtn[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}

/* Summary */
.summary{font-family:var(--font-read);font-size:1.05rem;line-height:1.95;margin:0}
.sent{cursor:pointer;border-radius:3px;padding:2px 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent:hover{background:var(--pen-wash)}
.sent.on{background:var(--marker);color:var(--marker-ink)}
.chart{margin:24px 0 0;padding-top:18px;border-top:1px solid var(--rule)}
.chart figcaption{margin-bottom:10px}
.ch-t{display:block;font-weight:700}
.ch-s{display:block;font-size:.88rem;color:var(--ink-soft)}
.brow{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr) 3.4rem;grid-template-areas:"lab track val";align-items:center;column-gap:12px;padding:5px 0;font-size:.95rem}
.blab{grid-area:lab;text-align:right;line-height:1.25}
.btrack{grid-area:track;height:18px;border-left:1px solid var(--rule-strong)}
.bfill{display:block;height:100%;background:var(--pen);border-radius:0 2px 2px 0}
.bval{grid-area:val;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Results */
.results{padding-top:52px;padding-bottom:72px;max-width:880px}
.res-head h1{font-family:var(--font-read);font-weight:600;font-size:clamp(2.1rem,5vw,3rem);letter-spacing:-.015em;margin:0 0 12px}
.res-score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:1.2rem;margin:0}
.res-num{font-family:var(--font-read);font-weight:600;font-size:clamp(3.4rem,10vw,5.2rem);line-height:1;color:var(--pen)}
.res-head{margin-bottom:40px}
.results h2{margin-top:8px}
details.review{border-top:1px solid var(--rule);padding:14px 0}
details.review:last-of-type{border-bottom:1px solid var(--rule)}
details.review summary{cursor:pointer;font-weight:700;display:flex;align-items:baseline;gap:10px;list-style:none}
details.review summary::-webkit-details-marker{display:none}
.chev{display:inline-block;color:var(--pen);font-size:1.3rem;line-height:1;transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.rv-title{flex:1}
.rv-score{font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.rv-list{padding-top:6px}
.rv-note{color:var(--ink-soft);font-size:.95rem;margin:8px 0 4px}
.rv{display:flex;gap:12px;padding:12px 0;border-top:1px dashed var(--rule)}
.rv:first-child{border-top:0}
.rv-mark{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.rv.ok .rv-mark{background:var(--ok-wash);color:var(--ok)}
.rv.bad .rv-mark{background:var(--bad-wash);color:var(--alert)}
.rv-body p{margin:0 0 4px}
.rv-label{font-weight:700}
.rv-expl{color:var(--ink-soft);font-size:.95rem}
.res-actions{margin-top:32px}

/* Modal and toast */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:20px;z-index:50}
.modal[hidden]{display:none}
.modal-box{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:24px;max-width:460px;width:100%}
.modal-box h2{font-family:var(--font-read);font-weight:600;font-size:1.35rem;margin:0 0 8px}
.modal-box p{margin:0;color:var(--ink-soft)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:none;z-index:60}
.toast-msg{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-weight:700;max-width:520px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast-msg.show{opacity:1;transform:none}

/* Narrow screens */
@media (max-width:899px){
 .split,.order{grid-template-columns:minmax(0,1fr)}
 .sheet,.answers{min-width:0}
 .pane-switch{display:flex;margin:0 0 16px;border:1px solid var(--rule-strong);border-radius:4px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:5;background:var(--paper)}
 .pane-switch button{flex:1;font:inherit;font-weight:700;padding:10px;background:transparent;color:var(--ink);border:0;cursor:pointer}
 .pane-switch button[aria-selected="true"]{background:var(--pen);color:var(--on-pen)}
 .task[data-pane="text"] .pane-answers{display:none}
 .task[data-pane="answers"] .pane-text{display:none}
 .mobile-only{display:inline-block;margin-top:20px}
}
@media (max-width:560px){
 .wrap{padding-left:14px;padding-right:14px}
 .pcols{grid-template-columns:1fr}
 .tb-left strong,.tb-sep{display:none}
 .reading{font-size:1.02rem}
 .brow{grid-template-columns:minmax(0,1fr) 3.4rem;grid-template-areas:"lab lab" "track val";row-gap:4px;padding:6px 0}
 .blab{text-align:left}
}
.pair-hint{margin:0 0 14px;color:var(--ink-soft);font-size:.95rem}.pcol.pn{margin-bottom:22px}.pcol.pn .pslots{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}.pcol.over{outline:3px solid var(--pen);outline-offset:2px;background:var(--pen-wash)}.plist.over{outline:3px dashed var(--pen);outline-offset:4px;border-radius:6px}.pslot.filled{align-items:flex-start;cursor:grab}.pslot .ptext{flex:1}.px{font:inherit;background:none;border:0;color:var(--ink-soft);cursor:pointer;min-width:32px;min-height:32px;padding:0;flex:none}.px:hover{color:var(--alert)}.px:focus-visible{outline:3px solid var(--pen);outline-offset:1px;border-radius:4px}.drag-handle{display:inline-flex;align-items:center;justify-content:center;width:24px;min-height:24px;margin-right:6px;color:var(--ink-soft);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}@media (pointer:fine){.pst{cursor:grab}}.drag-ghost{position:fixed;left:0;top:0;z-index:80;max-width:320px;padding:8px 12px;border-radius:6px;background:var(--sheet);color:var(--ink);border:2px solid var(--pen);box-shadow:0 8px 22px rgba(12,18,26,.22);font-size:.95rem;pointer-events:none}body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}@media (max-width:520px){.pcol.pn .pslots{grid-template-columns:1fr}}details.src{margin-top:.6em}details.src summary{cursor:pointer;font-weight:700;color:var(--pen)}details.src ul{margin:.5em 0 0;padding-left:1.2em}details.src li{margin:.25em 0}</style>
<style>.site-back{max-width:1180px;margin:0 auto;padding:12px 20px 0;font-family:var(--font-ui);font-size:.95rem}.site-back a{color:var(--pen);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:.4em;padding:6px 0}.site-back a:hover{text-decoration:underline}.site-back a:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:4px}</style>
</head>

<nav class="site-back" aria-label="Website"><a href="../index.html" data-site-back><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Alle Modelltests</a></nav>
<div id="app"></div>

<div class="modal" id="modal" hidden>
 <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-h" aria-describedby="modal-p">
 <h2 id="modal-h"></h2>
 <p id="modal-p"></p>
 <div class="modal-actions">
 <button type="button" class="btn ghost" data-act="modal-cancel">Abbrechen</button>
 <button type="button" class="btn primary" data-act="modal-ok" id="modal-ok"></button>
 </div>
 </div>
</div>
<div class="toast" aria-live="polite"><div class="toast-msg" id="toast"></div></div>

<script>

 heading:'Honig vom Hochhausdach',
 paragraphs:[
 'In vielen europäischen Großstädten summt es inzwischen auf Dächern, Balkonen und in Hinterhöfen. Die Zahl der Hobbyimkerinnen und -imker ist in den vergangenen Jahren deutlich gestiegen, und gerade in Städten stellen sich immer mehr Menschen einen eigenen Bienenstock auf. Hotels werben mit Honig aus eigener Produktion, Unternehmen siedeln Bienenvölker auf ihren Bürogebäuden an, und Schulen gründen Imker-AGs. Die Honigbiene ist zu einem Symbol für ein neues Umweltbewusstsein geworden.',
 'Dass Bienen in der Stadt gut zurechtkommen, überrascht auf den ersten Blick. Doch Städte bieten den Insekten oft erstaunlich gute Bedingungen: In Parks, auf Friedhöfen, an Straßenbäumen und in privaten Gärten blüht es häufig vom Frühjahr bis in den Herbst hinein. Auf dem Land dagegen prägen vielerorts große Monokulturen das Bild, die nur wenige Wochen im Jahr Nahrung liefern. Zudem werden in Städten deutlich weniger Pflanzenschutzmittel eingesetzt als in der intensiven Landwirtschaft. Honig aus der Stadt ist daher in der Regel nicht stärker mit Schadstoffen belastet als Honig vom Land, in manchen Untersuchungen schnitt er sogar besser ab.',
 'Wer allerdings glaubt, mit einem Bienenstock auf dem Balkon einen Beitrag zum Artenschutz zu leisten, irrt sich, betonen viele Biologinnen und Biologen. Die Honigbiene ist ein Nutztier, das vom Menschen gezüchtet und gehalten wird; vom Aussterben bedroht ist sie keineswegs. Gefährdet sind vielmehr die Wildbienen: Allein in Deutschland gibt es rund 600 Arten, und etwa die Hälfte von ihnen steht auf der Roten Liste der gefährdeten Tierarten. Anders als Honigbienen leben die meisten von ihnen nicht in Völkern, sondern allein, und viele sind auf ganz bestimmte Pflanzen spezialisiert.',
 'Genau hier sehen Fachleute ein wachsendes Problem. Ein einziges Honigbienenvolk umfasst im Sommer Zehntausende Tiere, die täglich große Mengen Nektar und Pollen sammeln. Stehen in einem Stadtviertel zu viele Bienenstöcke, konkurrieren die Honigbienen mit den Wildbienen um dieselben Blüten. So beobachtete ein Forschungsteam 2019 in Paris, dass Wildbienen dort, wo viele Bienenstöcke stehen, seltener an Blüten zu finden waren. Ob hier tatsächlich ein ursächlicher Zusammenhang besteht, ist allerdings noch nicht abschließend geklärt.',

 'Wer den Bienen in der Stadt wirklich helfen möchte, muss deshalb nicht unbedingt selbst imkern. Sinnvoller sei es, so die Empfehlung vieler Naturschutzverbände, für ein vielfältiges Nahrungsangebot zu sorgen: heimische Blühpflanzen auf dem Balkon, seltener gemähte Rasenflächen oder offene Bodenstellen, in denen Wildbienen ihre Nester anlegen können. Davon profitieren Honig- und Wildbienen gleichermaßen.'

 heading:'Kommentar: Brauchen wir den Hörsaal noch?',
 byline:'Kommentar einer Hochschuldidaktikerin',
 paragraphs:[
 'Seit einigen Jahren stellen immer mehr Hochschulen ihre Vorlesungen als Videos ins Netz. Studierende können sich die Inhalte so ansehen, wann und wo sie wollen – ein Angebot, das vor allem Berufstätige und Studierende mit Kindern schätzen. [1] Dass die Hochschulen damit endlich auf die Lebensrealität ihrer Studierenden eingehen, ist ein längst überfälliger Schritt.',

 instructions:['Lesen Sie den Text.','Entscheiden Sie für jede Aussage (1–7), ob sie zum Lesen auf Papier, zum Lesen am Bildschirm, zu beiden oder gar nicht passt.','Für jede Aussage gibt es genau eine richtige Lösung. Die Aussagen folgen nicht dem Textverlauf.'],
 heading:'Papier oder Bildschirm?',
 paragraphs:[
 'Ob im Studium, im Beruf oder in der Freizeit: Ein immer größerer Teil unserer Lektüre findet heute am Bildschirm statt. Doch lesen wir digital genauso gut wie auf Papier? Eine Forschungsgruppe um den spanischen Psychologen Pablo Delgado hat dazu 2018 insgesamt 54 Studien mit über 170.000 Teilnehmenden ausgewertet. Das Ergebnis: Sachtexte wurden auf Papier im Durchschnitt besser verstanden als am Bildschirm. Bei rein erzählenden Texten wie Romanen zeigte sich dagegen kein Unterschied.',
 'Die Forschenden erklären den Vorteil des Papiers unter anderem damit, dass am Bildschirm schneller und oberflächlicher gelesen wird: Der Blick springt über die Zeilen, statt den Text Satz für Satz zu erfassen. Besonders deutlich war der Vorteil des Papiers, wenn die Versuchspersonen unter Zeitdruck standen, und in neueren Studien fiel er sogar größer aus als in älteren.',
 'Ein weiterer Faktor ist die räumliche Orientierung. Wer ein gedrucktes Buch liest, weiß oft noch Wochen später, ob eine bestimmte Information oben links oder unten rechts auf einer Seite stand. Beim Scrollen fällt diese Art der Erinnerung weitgehend weg, was es schwerer macht, sich den Aufbau eines Textes einzuprägen.',
 'Allerdings hat auch das digitale Lesen klare Vorteile. Digitale Texte lassen sich mühelos nach Stichwörtern durchsuchen, die Schriftgröße kann angepasst werden, und Hunderte Bücher passen auf ein einziges Gerät. Für Menschen mit einer Sehschwäche kann das eine große Erleichterung sein.',
 'Und die Umwelt? Hier fällt die Bilanz gemischt aus: Sowohl die Papierherstellung als auch die Produktion elektronischer Geräte verbrauchen erhebliche Mengen an Energie und Rohstoffen. Welche Variante nachhaltiger ist, hängt vor allem davon ab, wie viele Bücher auf einem Gerät gelesen werden und wie lange es genutzt wird.',
 'Viele Fachleute raten deshalb zu einer bewussten Kombination: Für die gründliche Lektüre komplexer Texte eignet sich Papier häufig besser, für die schnelle Recherche und das Nachschlagen dagegen der Bildschirm.'
 ],

 instructions:['Lesen Sie den Text.','Entscheiden Sie, welche Aussagen laut Text stimmen, und ordnen Sie sie der passenden Kategorie zu.','Es müssen vier Aussagen zugeordnet werden, zwei pro Kategorie. Vier Aussagen passen nicht.'],
 heading:'Arbeiten von zu Hause',
 paragraphs:[
 'Für Millionen Beschäftigte ist das Arbeiten von zu Hause längst Alltag geworden: Nach Angaben des Statistischen Bundesamtes arbeitete 2025 ein Viertel aller Erwerbstätigen in Deutschland zumindest gelegentlich im Homeoffice; vor der Pandemie, im Jahr 2019, waren es nur 13 Prozent. Viele schätzen vor allem, dass der tägliche Weg zur Arbeit entfällt: Wer nicht pendeln muss, spart Zeit und Geld und kann Beruf und Familie oft leichter miteinander vereinbaren. Nicht zufällig nutzen Beschäftigte mit einem Arbeitsweg von 50 Kilometern oder mehr das Homeoffice besonders häufig: 2024 waren es 42 Prozent von ihnen. Umfragen zeigen außerdem, dass sich viele Beschäftigte zu Hause besser konzentrieren können, weil sie seltener von Kolleginnen und Kollegen unterbrochen werden.',
 'Doch die neue Freiheit hat auch Schattenseiten. Da Arbeitsplatz und Wohnung identisch sind, fällt es vielen schwer, nach Feierabend wirklich abzuschalten. Nicht selten werden abends noch E-Mails beantwortet oder Aufgaben erledigt; Arbeitspsychologen beobachten, dass die Grenze zwischen Beruf und Privatleben zunehmend verschwimmt. Hinzu kommt, dass der informelle Austausch in der Kaffeeküche fehlt. Vor allem Berufseinsteigerinnen und -einsteiger berichten, dass sie sich zu Hause isoliert fühlen und es schwerer haben, im Unternehmen Kontakte zu knüpfen.',
 'Auch für die Unternehmen verändert sich einiges. Einerseits können sie Büroflächen verkleinern und so Kosten sparen. Andererseits müssen sie in digitale Technik investieren und neue Formen der Zusammenarbeit entwickeln. Viele Firmen setzen inzwischen auf ein Mischmodell, bei dem die Beschäftigten an einigen Tagen im Büro und an anderen zu Hause arbeiten. Tatsächlich arbeitete 2024 nur knapp ein Viertel derjenigen, die das Homeoffice nutzten, ausschließlich von zu Hause aus.'

 paragraphs:[
 'In vielen deutschen Städten ist das Fahrrad in den letzten Jahren zu einem ernstzunehmenden Verkehrsmittel geworden. Nach Zahlen des Branchenverbands ZIV gibt es in Deutschland inzwischen rund 89 Millionen Fahrräder und E-Bikes, also mehr Räder als Einwohner. Einen zusätzlichen Schub erhielt der Radverkehr durch Elektrofahrräder: Sie machen auch längere Pendelstrecken und hügeliges Gelände für viele Menschen attraktiv, zunehmend auch für ältere. Billig ist der Umstieg allerdings nicht: Ein E-Bike kostete 2023 im Durchschnitt 2.950 Euro, ein Fahrrad ohne Motor dagegen 470 Euro.',

var PN = 2;
function pairCap(t, k){ return k === PN ? t.statements.length - t.items : 2; }
function pairLabel(t, k){ return k === PN ? 'passt nicht' : t.cats[k]; }
function pairArea(t, a){
 function card(i){
 return '<div class="pslot filled" data-drag-i="'+i+'"><span class="drag-handle" aria-hidden="true">⠿</span><span class="ptext">'+t.statements[i].text+'</span>'+
 '<button type="button" class="px" data-act="punassign" data-i="'+i+'" aria-label="Zuordnung entfernen">✕</button></div>';
 }
 function zone(label, k){
 var cap = pairCap(t, k), ids = [], slots = '';
 a.forEach(function(v,i){ if (v === k) ids.push(i); });
 for (var n = 0; n < cap; n++) slots += (ids[n] !== undefined) ? card(ids[n]) : '<div class="pslot empty">frei</div>';
 return '<div class="pcol'+(k === PN ? ' pn' : '')+'" data-drop="'+k+'"><h3 class="pcol-h"><span>'+label+'</span><span class="count">'+ids.length+'/'+cap+'</span></h3><div class="pslots">'+slots+'</div></div>';
 }
 var cols = t.cats.map(function(c,k){ return zone(c, k); }).join('');
 var short = t.catsShort.concat(['passt nicht']);
 var list = t.statements.map(function(s,i){
 var btns = short.map(function(c,k){
 return '<button type="button" class="pbtn'+(k === PN ? ' pbtn-pn' : '')+'" data-act="passign" data-i="'+i+'" data-k="'+k+'" id="pb-'+i+'-'+k+'" aria-pressed="'+(a[i]===k)+'">'+c+'</button>';
 }).join('');
 return '<li class="pst'+(a[i]!==null?' assigned':'')+'" data-drag-i="'+i+'"><p><span class="drag-handle" aria-hidden="true">⠿</span>'+s.text+'</p><div class="pbtns">'+btns+'</div></li>';
 }).join('');
 return '<div id="pair-area"><p class="pair-hint">Ziehen Sie die Aussagen in die passende Spalte oder tippen Sie auf eine Schaltfläche. '+
 'Vier Aussagen passen in keine der beiden Kategorien: Ordnen Sie diese „passt nicht“ zu. Mit ✕ oder durch Zurückziehen in die Liste entfernen Sie eine Zuordnung.</p>'+
 '<div class="pcols">'+cols+'</div>'+zone('Passt nicht', PN)+
 '<h3 class="col-h">Aussagen</h3><ul class="plist" data-drop="list">'+list+'</ul></div>';
}

 }).join('');

 return '<figure class="chart"><figcaption><span class="ch-t">'+c.title+'</span><span class="ch-s">'+c.subtitle+'</span></figcaption>'+

/* Drag and drop for Aufgabe 6 (mouse: whole card; touch/pen: the ⠿ handle, so the page can still scroll) */
var drag = null, suppressClick = false;
function dropZoneAt(x, y){
 if (drag && drag.ghost) drag.ghost.style.display = 'none';
 var el = document.elementFromPoint(x, y);
 if (drag && drag.ghost) drag.ghost.style.display = '';
 return el && el.closest ? el.closest('[data-drop]') : null;
}
function scrollerOf(el){
 for (var n = el && el.parentElement; n && n !== document.body; n = n.parentElement) {
 var oy = getComputedStyle(n).overflowY;
 if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight) return n;
 }
 return null;
}
function autoScroll(){
 if (!drag || !drag.on) return;
 var r = drag.scroller ? drag.scroller.getBoundingClientRect() : { top: 0, bottom: window.innerHeight };
 var edge = 80, y = drag.lastY, v = 0;
 if (y < r.top + edge) v = -Math.ceil((r.top + edge - y) / 5);
 else if (y > r.bottom - edge) v = Math.ceil((y - (r.bottom - edge)) / 5);
 if (v) { if (drag.scroller) drag.scroller.scrollTop += v; else window.scrollBy(0, v); }
 requestAnimationFrame(autoScroll);
}
function clearOver(keep){
 Array.prototype.forEach.call(document.querySelectorAll('[data-drop].over'), function(z){ if (z !== keep) z.classList.remove('over'); });
}
document.addEventListener('pointerdown', function(e){
 if (state.idx < 0 || !TASKS[state.idx] || TASKS[state.idx].type !== 'pair') return;
 var src = e.target.closest && e.target.closest('[data-drag-i]');
 if (!src || e.button > 0 || e.target.closest('button')) return;
 if (e.pointerType !== 'mouse' && !e.target.closest('.drag-handle')) return;
 drag = { i: +src.getAttribute('data-drag-i'), x: e.clientX, y: e.clientY, lastY: e.clientY, on: false, ghost: null, scroller: null };
});
document.addEventListener('pointermove', function(e){
 if (!drag) return;
 if (!drag.on) {
 if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 6) return;
 drag.on = true;
 var g = document.createElement('div');
 g.className = 'drag-ghost';
 g.textContent = TASKS[state.idx].statements[drag.i].text;
 document.body.appendChild(g);
 drag.ghost = g;
 document.body.classList.add('is-dragging');
 drag.scroller = scrollerOf(document.getElementById('pair-area'));
 requestAnimationFrame(autoScroll);
 }
 drag.lastY = e.clientY;
 e.preventDefault();
 drag.ghost.style.transform = 'translate('+(e.clientX + 12)+'px,'+(e.clientY + 12)+'px)';
 var over = dropZoneAt(e.clientX, e.clientY);
 clearOver(over);
 if (over) over.classList.add('over');
}, { passive: false });
function endDrag(e, cancel){
 if (!drag) return;
 var d = drag, zone = (!cancel && d.on) ? dropZoneAt(e.clientX, e.clientY) : null;
 drag = null;
 if (!d.on) return;
 suppressClick = true;
 setTimeout(function(){ suppressClick = false; }, 0);
 if (d.ghost) d.ghost.remove();
 document.body.classList.remove('is-dragging');
 clearOver(null);
 if (!zone) return;
 var k = zone.getAttribute('data-drop');
 if (k === 'list') { if (cur()[d.i] !== null) unassignPair(d.i); }
 else assignPair(d.i, +k, true);
}
document.addEventListener('pointerup', function(e){ endDrag(e, false); });
document.addEventListener('pointercancel', function(e){ endDrag(e, true); });
document.addEventListener('click', function(e){
 if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; }
}, true);

function toggleSent(i, el){
 var a = cur();
 if (!a[i] && a.filter(Boolean).length >= 3) { toast('Es sind genau drei Sätze falsch. Heben Sie zuerst eine Markierung auf.'); return; }
 a[i] = !a[i];
 el.classList.toggle('on', a[i]);
 el.setAttribute('aria-pressed', String(a[i]));
 var c = document.getElementById('sum-count');
 if (c) c.textContent = a.filter(Boolean).length + ' von 3 markiert';
}

function setPane(p){
 state.pane = p;
 var main = app.querySelector('.task');
 if (main) main.setAttribute('data-pane', p);
 Array.prototype.forEach.call(app.querySelectorAll('.pane-switch [data-p]'), function(b){
 b.setAttribute('aria-selected', String(b.getAttribute('data-p') === p));
 });
 var sp = app.querySelector('.split'), tb = app.querySelector('.topbar'), sw = app.querySelector('.pane-switch');
 if (sp) {
 var offset = (tb ? tb.offsetHeight : 0) + (sw ? sw.offsetHeight : 0) + 24;
 var y = sp.getBoundingClientRect().top + window.pageYOffset - offset;
 if (window.pageYOffset > y) window.scrollTo(0, Math.max(0, y));
 }
}

/* ================= Flow and timer ================= */
function stopTimer(){ if (state.timer) { clearInterval(state.timer); state.timer = null; } }

function goTo(i){
 stopTimer();
 state.idx = i; state.pane = 'text'; state.armed = null;
 if (state.mode === 'exam') {
 state.remaining = TASKS[i].minutes * 60;
 state.deadline = Date.now() + state.remaining * 1000;
 }
 renderTask();
 window.scrollTo(0, 0);
 if (state.mode === 'exam') state.timer = setInterval(tick, 250);
}

function tick(){
 var r = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
 if (r !== state.remaining) {
 state.remaining = r;
 updateTimerUI();
 if (r === 60 && state.warned !== state.idx) { state.warned = state.idx; toast('Noch 1 Minute für diese Aufgabe.'); }
 }
 if (r <= 0) timeUp();
}

function updateTimerUI(){
 if (state.mode !== 'exam' || state.idx < 0) return;
 var t = TASKS[state.idx], r = state.remaining;
 var clock = document.getElementById('clock'), f = document.getElementById('curfill');
 if (clock) {
 clock.textContent = fmt(r);
 clock.classList.toggle('warn', r <= 60);
 clock.setAttribute('aria-label', 'Verbleibende Zeit: ' + Math.floor(r/60) + ' Minuten ' + (r % 60) + ' Sekunden');
 }
 if (f) {
 f.style.width = (r / (t.minutes * 60) * 100) + '%';
 f.parentNode.classList.toggle('warn', r <= 60);
 }
}

function timeUp(){
 stopTimer();
 closeModal(true);
 var last = state.idx === TASKS.length - 1;
 if (last) { finish(); toast('Die Zeit ist abgelaufen. Hier ist Ihr Ergebnis.'); }
 else { var n = state.idx + 1; goTo(state.idx + 1); toast('Die Zeit für Aufgabe '+n+' ist abgelaufen.'); }
}

function unanswered(i){
 var t = TASKS[i], a = state.answers[i];
 if (t.type === 'pair') return 4 - a.filter(function(v){ return v !== null; }).length;
 if (t.type === 'summary') return 3 - a.filter(Boolean).length;
 return a.filter(function(v){ return v === null; }).length;
}
function itemsText(n){ return n === 1 ? '1 Item ist' : n + ' Items sind'; }

function requestNext(){
 var last = state.idx === TASKS.length - 1;
 if (state.mode === 'practice') {
 if (last) requestFinish(); else goTo(state.idx + 1);
 return;
 }
 var open = unanswered(state.idx);
 var note = open > 0 ? 'Noch ' + itemsText(open) + ' in dieser Aufgabe unbearbeitet. ' : '';
 if (last) openModal('Test beenden?', note + 'Danach sehen Sie Ihr Ergebnis mit Lösungen und Erklärungen.', 'Test beenden', finish);
 else openModal('Weiter zu Aufgabe ' + (state.idx + 2) + '?', note + 'Wie in der Prüfung können Sie danach nicht mehr zu dieser Aufgabe zurück.', 'Weiter', function(){ goTo(state.idx + 1); });
}
function requestFinish(){
 var open = sum(TASKS.map(function(_, i){ return unanswered(i); }));
 openModal('Test auswerten?', (open > 0 ? 'Noch ' + itemsText(open) + ' unbearbeitet. ' : '') + 'Danach sehen Sie Ihr Ergebnis mit Lösungen und Erklärungen.', 'Auswerten', finish);
}
function requestQuit(){
 openModal('Test beenden?', 'Nicht bearbeitete Items werden mit 0 Punkten gewertet. Danach sehen Sie Ihr Ergebnis mit Lösungen und Erklärungen.', 'Test beenden', finish);
}

function startTest(){
 var m = app.querySelector('input[name="mode"]:checked');
 state.mode = m ? m.value : 'exam';
 state.warned = -1;
 initAnswers();
 goTo(0);
}

function finish(){
 stopTimer();
 closeModal(true);
 renderResults();
 window.scrollTo(0, 0);
}

/* ================= Scoring and results ================= */
function scoreTask(t, a){
 var s = 0, i;
 switch (t.type) {
 case 'gap': for (i = 0; i < t.gaps.length; i++) if (a[i] === t.gaps[i].answer) s++; break;
 case 'order': for (i = 0; i < t.solution.length; i++) if (a[i] === t.solution[i]) s++; break;
 case 'mc': for (i = 0; i < t.questions.length; i++) if (a[i] === t.questions[i].answer) s++; break;
 case 'speech': for (i = 0; i < t.markers.length; i++) if (a[i] === t.markers[i].answer) s++; break;
 case 'category': for (i = 0; i < t.statements.length; i++) if (a[i] === t.statements[i].answer) s++; break;
 case 'pair': for (i = 0; i < t.statements.length; i++) if (t.statements[i].answer !== null && a[i] === t.statements[i].answer) s++; break;
 case 'summary': for (i = 0; i < t.sentences.length; i++) if (t.sentences[i].wrong && a[i]) s++; break;
 }
 return s;
}

function rv(ok, label, yours, right, why){
 return '<div class="rv '+(ok?'ok':'bad')+'"><span class="rv-mark" aria-hidden="true">'+(ok?'✓':'✗')+'</span>'+
 '<div class="rv-body"><p class="rv-label"><span class="sr">'+(ok?'Richtig: ':'Falsch: ')+'</span>'+label+'</p>'+
 '<p>Ihre Antwort: '+(yours == null ? '<em>keine Antwort</em>' : '<strong>'+yours+'</strong>')+'</p>'+
 (ok ? '' : '<p>Richtig: <strong>'+right+'</strong></p>')+
 (why ? '<p class="rv-expl">'+why+'</p>' : '')+'</div></div>';
}

var REVIEW = {
 gap: function(t, a){
 return t.gaps.map(function(g,i){ return rv(a[i]===g.answer, 'Lücke '+(i+1), a[i]==null?null:g.options[a[i]], g.options[g.answer], g.why); }).join('');
 },
 order: function(t, a){
 return t.solution.map(function(c,i){
 return rv(a[i]===c, 'Position '+(i+(t.first?2:1)), a[i]==null?null:'Abschnitt '+LET[a[i]], 'Abschnitt '+LET[c], t.why[i]);
 }).join('') + '<p class="rv-note">Richtige Reihenfolge: '+(t.first?'1, ':'')+t.solution.map(function(c){ return LET[c]; }).join(', ')+'</p>';
 },
 mc: function(t, a){
 return t.questions.map(function(q,i){ return rv(a[i]===q.answer, 'Frage '+(i+1)+': '+q.stem, a[i]==null?null:q.options[a[i]], q.options[q.answer], q.why); }).join('');
 },
 speech: function(t, a){
 return t.markers.map(function(m,i){ return rv(a[i]===m.answer, 'Textstelle '+(i+1), a[i]==null?null:t.options[a[i]], t.options[m.answer], m.why); }).join('');
 },
 category: function(t, a){
 return t.statements.map(function(s,i){ return rv(a[i]===s.answer, (i+1)+'. '+s.text, a[i]==null?null:t.cats[a[i]], t.cats[s.answer], s.why); }).join('');
 },
 pair: function(t, a){
 return '<p class="rv-note">Punkte gibt es für die vier Aussagen, die in die richtige Kategorie gehören. Die Zuordnung „passt nicht“ dient Ihrer Übersicht und bringt keine Punkte.</p>' +
 t.statements.map(function(s,i){
 var yours = a[i] == null ? 'nicht zugeordnet' : (a[i] === 2 ? 'passt nicht' : t.cats[a[i]]);
 var right = s.answer == null ? 'passt nicht' : t.cats[s.answer];
 var ok = s.answer == null ? (a[i] == null || a[i] === 2) : a[i] === s.answer;
 return rv(ok, s.text, yours, right, s.why);
 }).join('');
 },
 summary: function(t, a){
 return '<p class="rv-note">Punkte gibt es für jeden der drei falschen Sätze, den Sie markiert haben.</p>' +
 t.sentences.map(function(s,i){
 var ok = s.wrong ? !!a[i] : !a[i];
 return '<div class="rv '+(ok?'ok':'bad')+'"><span class="rv-mark" aria-hidden="true">'+(ok?'✓':'✗')+'</span><div class="rv-body">'+
 '<p class="rv-label">„'+s.text+'“</p>'+
 '<p>Inhaltlich <strong>'+(s.wrong?'falsch':'richtig')+'</strong>. '+(a[i]?'Sie haben den Satz markiert.':'Sie haben den Satz nicht markiert.')+'</p>'+
 '<p class="rv-expl">'+s.why+'</p></div></div>';
 }).join('');
 }
};

function verdict(p){
 if (p >= 80) return 'Sehr stark. Achten Sie jetzt vor allem darauf, das Tempo auch bei schwierigen Texten zu halten.';
 if (p >= 60) return 'Eine solide Grundlage. Sehen Sie sich die Aufgaben mit den meisten Fehlern genauer an.';
 return 'Ein guter Ausgangspunkt. Die Erklärungen unten zeigen, wo Sie am schnellsten Punkte dazugewinnen.';
}

function renderResults(){
 var scores = TASKS.map(function(t,i){ return scoreTask(t, state.answers[i]); });
 var total = sum(scores), pct = Math.round(total / TOTAL_ITEMS * 100);
 var rows = TASKS.map(function(t,i){
 return '<li class="plan-row"><span class="plan-n">'+(i+1)+'</span><span class="plan-name">'+t.name+'</span>'+
 '<span class="plan-meta"><strong>'+scores[i]+'</strong> von '+t.items+'</span>'+
 '<span class="plan-bar" aria-hidden="true"><span style="width:'+(scores[i]/t.items*100)+'%"></span></span></li>';
 }).join('');
 var reviews = TASKS.map(function(t,i){
 return '<details class="review"'+(i===0?' open':'')+'><summary><span class="chev" aria-hidden="true">›</span>'+
 '<span class="rv-title">Aufgabe '+(i+1)+': '+t.name+'</span><span class="rv-score">'+scores[i]+' von '+t.items+'</span></summary>'+
 '<div class="rv-list">'+REVIEW[t.type](t, state.answers[i])+'</div></details>';
 }).join('');
 app.innerHTML =
 '<main class="wrap results">'+
 '<header class="res-head"><h1>Ihr Ergebnis</h1>'+
 '<p class="res-score"><span class="res-num">'+total+'</span><span>von '+TOTAL_ITEMS+' Punkten, das sind '+pct+' %.</span></p>'+
 '<p class="fine">'+verdict(pct)+' Das Ergebnis dient nur zur Orientierung: Die offiziellen TDN-Stufen berechnet das TestDaF-Institut nach einem eigenen Verfahren.</p>'+
 '</header>'+
 '<h2>Punkte pro Aufgabe</h2><ol class="plan-list">'+rows+'</ol>'+
 '<h2>Lösungen und Erklärungen</h2>'+reviews+
 '<div class="res-actions"><button type="button" class="btn primary" data-act="restart">Zur Startseite</button></div>'+
 '</main>';
}

/* ================= Modal and toast ================= */
function openModal(title, text, okLabel, onOk){
 document.getElementById('modal-h').textContent = title;
 document.getElementById('modal-p').textContent = text;
 var ok = document.getElementById('modal-ok');
 ok.textContent = okLabel;
 state.modalOk = onOk;
 state.lastFocus = document.activeElement;
 modal.hidden = false;
 ok.focus();
}
function closeModal(skipFocus){
 if (modal.hidden) return;
 modal.hidden = true;
 state.modalOk = null;
 if (!skipFocus && state.lastFocus && document.body.contains(state.lastFocus)) state.lastFocus.focus();
}
function toast(msg){
 toastEl.textContent = msg;
 toastEl.classList.add('show');
 clearTimeout(toastTimer);
 toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 3400);
}

/* ================= Events ================= */
document.addEventListener('click', function(e){
 if (e.target === modal) { closeModal(); return; }
 var el = e.target.closest ? e.target.closest('[data-act]') : null;
 if (!el) return;
 var act = el.getAttribute('data-act');
 switch (act) {
 case 'start': startTest(); break;
 case 'pane': setPane(el.getAttribute('data-p')); break;
 case 'place': armChunk(+el.getAttribute('data-j')); break;
 case 'slot': clickSlot(+el.getAttribute('data-i')); break;
 case 'passign': assignPair(+el.getAttribute('data-i'), +el.getAttribute('data-k')); break;
 case 'punassign': unassignPair(+el.getAttribute('data-i')); break;
 case 'sent': toggleSent(+el.getAttribute('data-i'), el); break;
 case 'next': requestNext(); break;
 case 'prev': goTo(state.idx - 1); break;
 case 'quit': requestQuit(); break;
 case 'restart': state.idx = -1; renderStart(); window.scrollTo(0, 0); break;
 case 'modal-ok': { var fn = state.modalOk; closeModal(true); if (fn) fn(); break; }
 case 'modal-cancel': closeModal(); break;
 }
});

document.addEventListener('change', function(e){
 var el = e.target, act = el.getAttribute && el.getAttribute('data-act');
 if (!act || state.idx < 0) return;
 var a = cur(), i = +el.getAttribute('data-i');
 if (act === 'gap' || act === 'speech') {
 a[i] = el.value === '' ? null : +el.value;
 if (act === 'speech') syncSpeech();
 } else if (act === 'mc' || act === 'cat') {
 a[i] = +el.value;
 }
});

document.addEventListener('keydown', function(e){
 if (e.key === 'Escape' && !modal.hidden) { closeModal(); return; }
 var s = e.target.closest ? e.target.closest('.sent') : null;
 if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleSent(+s.getAttribute('data-i'), s); }
});

renderStart();
})();
</script>
<script>
(function () {
 var KEY = 'testdaf:lesen:1', saved = false;
 function check() {
 var el = document.querySelector('.res-num');
 if (!el) { saved = false; return; }
 if (saved) return;
 var score = parseInt(el.textContent, 10), sib = el.nextElementSibling;
 var m = sib && sib.textContent.match(/von\s+(\d+)/);
 if (isNaN(score) || !m) return;
 saved = true;
 try {
 var prev = JSON.parse(localStorage.getItem(KEY) || 'null') || {};
 localStorage.setItem(KEY, JSON.stringify({
 last: score, max: +m[1], best: Math.max(score, prev.best || 0),
 runs: (prev.runs || 0) + 1, at: Date.now()
 }));
 } catch (e) {}
 }
 var app = document.getElementById('app');
 if (app && window.MutationObserver) new MutationObserver(check).observe(app, { childList: true, subtree: true });
 document.addEventListener('click', function (e) {
 var a = e.target.closest && e.target.closest('a[data-site-back]');
 if (!a) return;
 if (document.querySelector('.topbar') && !document.querySelector('.res-num') &&
 !window.confirm('Den Test wirklich verlassen? Ihre Antworten gehen dabei verloren.')) e.preventDefault();
 });
})();
</script>
