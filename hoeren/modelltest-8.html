<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modelltest Hören 8: Digitaler TestDaF (Übung)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700\&family=Literata:opsz,wght@7..72,400;7..72,600\&display=swap">
<style>
:root{
 --paper:#EDF1F4;--sheet:#FFFFFF;--ink:#18263A;--soft:#4B5C71;--rule:#D2DBE3;--rule-s:#A3B2C1;
 --pen:#2346A6;--on-pen:#FFFFFF;--pen-wash:#E3E9F8;--marker:#FFE27A;--marker-ink:#18263A;
 --alert:#B3261E;--ok:#1D7443;--ok-wash:#E1F1E7;--bad-wash:#FAE6E4;--scrim:rgba(12,18,26,.55);
 --font-r:"Literata",Georgia,"Times New Roman",serif;
 --font-ui:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 color-scheme:light;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#0E1319;--sheet:#161D25;--ink:#E3E9F0;--soft:#9DAEC1;--rule:#27323F;--rule-s:#44536A;
 --pen:#8EA8FF;--on-pen:#0B1017;--pen-wash:#1B2643;--marker:#6B5911;--marker-ink:#FFF4CC;
 --alert:#FF8E84;--ok:#6CD197;--ok-wash:#132C1F;--bad-wash:#361C1A;--scrim:rgba(0,0,0,.65);color-scheme:dark;
}}
:root[data-theme="dark"]{
 --paper:#0E1319;--sheet:#161D25;--ink:#E3E9F0;--soft:#9DAEC1;--rule:#27323F;--rule-s:#44536A;
 --pen:#8EA8FF;--on-pen:#0B1017;--pen-wash:#1B2643;--marker:#6B5911;--marker-ink:#FFF4CC;
 --alert:#FF8E84;--ok:#6CD197;--ok-wash:#132C1F;--bad-wash:#361C1A;--scrim:rgba(0,0,0,.65);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--paper);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:17px;line-height:1.5}
a{color:var(--pen)}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding-left:20px;padding-right:20px}
h2{font-size:1.05rem;margin:0 0 12px}
.btn{font:inherit;font-weight:700;font-size:1rem;line-height:1.2;border-radius:4px;padding:12px 22px;border:2px solid transparent;cursor:pointer}
.btn.primary{background:var(--pen);color:var(--on-pen)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-s)}
.btn.ghost:hover{border-color:var(--pen)}
.btn.small{padding:6px 12px;font-size:.9rem}
.bubble{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-s);background:var(--sheet);margin-top:1px}
input:checked + .bubble{background:var(--pen);border-color:var(--pen);box-shadow:inset 0 0 0 3px var(--sheet)}
input:focus-visible + .bubble{outline:3px solid var(--pen);outline-offset:2px}
.opt input,.mode-opt input,.g-cell input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

/* start */
.start{padding-top:56px;padding-bottom:72px;max-width:860px}
.start h1{font-family:var(--font-r);font-weight:600;font-size:clamp(2.6rem,8vw,4.4rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 18px}
.lede{font-size:1.15rem;max-width:56ch;color:var(--soft);margin:0 0 28px}
.note{border-left:3px solid var(--pen);background:var(--sheet);padding:12px 16px;border-radius:0 6px 6px 0;margin:0 0 32px;max-width:64ch;font-size:.95rem}
.note strong{display:block;margin-bottom:2px}
.plan-list{list-style:none;padding:0;margin:0 0 40px;border-top:1px solid var(--rule)}
.plan-row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;column-gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.plan-n{font-family:var(--font-r);font-size:1.25rem;font-weight:600;color:var(--pen);line-height:1}
.plan-name{font-weight:700}
.plan-meta{color:var(--soft);font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap}
.mode{margin:0 0 32px}
.mode-opt{position:relative;display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--rule);cursor:pointer;max-width:64ch}
.mode-opt:last-child{border-bottom:1px solid var(--rule)}
.mode-opt small{display:block;color:var(--soft);font-size:.95rem}
.fine{font-size:.92rem;color:var(--soft);max-width:64ch;margin:28px 0 0}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;padding-bottom:8px}
.tb-left{display:flex;align-items:center;gap:10px;font-size:.95rem;min-width:0}
.tb-sep{width:1px;height:16px;background:var(--rule-s)}
.tb-right{display:flex;align-items:center;gap:12px}
.phase{font-size:.9rem;color:var(--soft);white-space:nowrap}
.clock{font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums;min-width:4.4ch;text-align:right}
.clock.warn{color:var(--alert)}
.track{display:flex;gap:4px;padding-bottom:10px}
.seg{flex:1 1 0;height:6px;background:var(--pen-wash);border-radius:3px;overflow:hidden}
.seg .fill{display:block;height:100%;width:0;background:var(--pen)}
.seg.done .fill{width:100%;background:var(--rule-s)}

/* task */
.task{padding-top:24px;padding-bottom:56px}
.task-title{font-family:var(--font-r);font-weight:600;font-size:clamp(1.45rem,3.2vw,1.95rem);letter-spacing:-.01em;line-height:1.2;margin:0 0 12px}
.instr{border-left:3px solid var(--pen);padding:2px 0 2px 14px;margin:0 0 20px;color:var(--soft);max-width:74ch}
.instr p{margin:0 0 3px}

/* player */
.player{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 18px;margin:0 0 22px}
.pl-btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:4px;border:0;background:var(--pen);color:var(--on-pen);cursor:pointer}
.pl-btn:disabled{opacity:.45;cursor:not-allowed}
.pl-main{flex:1;min-width:180px}
.pl-status{font-weight:700;font-size:.95rem;margin:0 0 6px}
.pl-status.live{color:var(--ok)}
.pl-bar{height:6px;background:var(--pen-wash);border-radius:3px;overflow:hidden}
.pl-fill{height:100%;width:0;background:var(--pen)}
.pl-time{display:flex;justify-content:space-between;font-size:.82rem;color:var(--soft);font-variant-numeric:tabular-nums;margin-top:4px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{display:block;width:3px;background:currentColor;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:clamp(16px,3vw,28px)}
.hidden-note{color:var(--soft);font-style:italic;margin:0}

/* T1 table */
.tbl-wrap{overflow-x:auto}
table.ov{border-collapse:collapse;width:100%;min-width:640px;font-size:.93rem}
table.ov caption{font-family:var(--font-r);font-weight:600;font-size:1.15rem;text-align:left;margin:0 0 12px}
table.ov th,table.ov td{border:1px solid var(--rule);padding:9px 10px;text-align:left;vertical-align:top}
table.ov thead th{background:var(--pen-wash);color:var(--pen)}
table.ov tbody th{background:var(--paper);font-weight:700;white-space:nowrap}
.sub{display:block;color:var(--soft);font-size:.85rem;margin-top:6px}
.fill-in{width:100%;min-width:110px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--pen-wash);border:0;border-bottom:2px solid var(--pen);border-radius:3px 3px 0 0;padding:5px 6px;margin-top:2px}
.fill-in::placeholder{color:var(--soft)}
.fill-n{font-size:.75rem;font-weight:700;color:var(--pen);margin-right:3px}

/* T2 */
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pair-col{border:1px solid var(--rule-s);border-radius:6px;padding:14px}
.pair-col h3{margin:0 0 10px;font-size:1rem}
.pair-col label{display:block;font-size:.88rem;font-weight:700;color:var(--pen);margin:10px 0 4px}
.pair-col textarea{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--sheet);border:1px solid var(--rule-s);border-radius:4px;padding:8px;resize:vertical;min-height:58px}

/* T3 */
.notes{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--sheet);border:1px dashed var(--rule-s);border-radius:6px;padding:10px;min-height:110px;resize:vertical;margin:0 0 18px}
.summary{font-family:var(--font-r);font-size:1.05rem;line-height:1.95;margin:0}
.sent{cursor:pointer;border-radius:3px;padding:2px 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent:hover{background:var(--pen-wash)}
.sent.on{background:var(--marker);color:var(--marker-ink)}
.count{font-weight:400;color:var(--soft);font-variant-numeric:tabular-nums;font-size:.92rem}
.col-h{font-size:1rem;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* T4 */
.grow{border-top:1px solid var(--rule);padding:14px 0}
.grow:first-child{border-top:0;padding-top:0}
.g-stem{font-weight:700;display:flex;gap:10px;margin:0 0 10px}
.q-n{flex:none;font-family:var(--font-r);font-weight:600;color:var(--pen);min-width:1.3em}
.g-cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.g-cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;border-radius:4px;cursor:pointer;text-align:center}
.g-cell:hover{background:var(--pen-wash)}
.g-lab{font-size:.84rem;color:var(--soft);line-height:1.2}
input:checked ~ .g-lab{color:var(--ink);font-weight:700}

/* T5 */
.outline{display:grid;gap:14px}
.ol-row{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:12px;align-items:start}
.ol-label{font-weight:700;padding-top:6px}

/* T6 */
.q{border-top:1px solid var(--rule);padding:16px 0 12px}
.q:first-child{border-top:0;padding-top:0}
.q-stem{font-weight:700;margin:0 0 8px;display:flex;gap:10px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:8px;margin:0 -8px;border-radius:4px;cursor:pointer}
.opt:hover{background:var(--pen-wash)}

/* T7 */
.read-along{font-family:var(--font-r);font-size:1.08rem;line-height:2;margin:0}
.w{cursor:pointer;border-radius:3px;padding:1px 1px}
.w:hover{background:var(--pen-wash)}
.w.on{background:var(--marker);color:var(--marker-ink)}

/* nav */
.task-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;padding-top:20px;border-top:1px solid var(--rule);flex-wrap:wrap}
.nav-note{color:var(--soft);font-size:.92rem}

/* results */
.results{padding-top:52px;padding-bottom:72px;max-width:900px}
.res-head h1{font-family:var(--font-r);font-weight:600;font-size:clamp(2.1rem,5vw,3rem);letter-spacing:-.015em;margin:0 0 12px}
.res-score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:1.2rem;margin:0}
.res-num{font-family:var(--font-r);font-weight:600;font-size:clamp(3.4rem,10vw,5.2rem);line-height:1;color:var(--pen)}
.res-head{margin-bottom:36px}
.plan-bar{grid-column:2 / -1;height:6px;background:var(--pen-wash);border-radius:3px;overflow:hidden;margin-top:6px}
.plan-bar>span{display:block;height:100%;background:var(--pen)}
details.review{border-top:1px solid var(--rule);padding:14px 0}
details.review:last-of-type{border-bottom:1px solid var(--rule)}
details.review summary{cursor:pointer;font-weight:700;display:flex;align-items:baseline;gap:10px;list-style:none}
details.review summary::-webkit-details-marker{display:none}
.chev{display:inline-block;color:var(--pen);font-size:1.3rem;line-height:1;transition:transform .15s}
details[open] > summary .chev{transform:rotate(90deg)}
.rv-title{flex:1}
.rv-score{font-variant-numeric:tabular-nums;color:var(--soft);white-space:nowrap}
.rv{display:flex;gap:12px;padding:12px 0;border-top:1px dashed var(--rule)}
.rv:first-child{border-top:0}
.rv-mark{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.rv.ok .rv-mark{background:var(--ok-wash);color:var(--ok)}
.rv.bad .rv-mark{background:var(--bad-wash);color:var(--alert)}
.rv-body p{margin:0 0 4px}
.rv-label{font-weight:700}
.rv-expl{color:var(--soft);font-size:.95rem}
.rv-note{color:var(--soft);font-size:.95rem;margin:8px 0 4px}
details.tr{margin-top:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 14px}
details.tr summary{cursor:pointer;font-weight:700;color:var(--pen)}
.tr p{margin:8px 0 0;font-family:var(--font-r);font-size:.98rem;line-height:1.7}
.tr b{font-family:var(--font-ui)}

/* modal / toast */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:20px;z-index:50}
.modal[hidden]{display:none}
.modal-box{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:24px;max-width:460px;width:100%}
.modal-box h2{font-family:var(--font-r);font-weight:600;font-size:1.35rem;margin:0 0 8px}
.modal-box p{margin:0;color:var(--soft)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:none;z-index:60}
.toast-msg{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-weight:700;max-width:520px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast-msg.show{opacity:1;transform:none}

@media (max-width:700px){
 .pair-grid{grid-template-columns:1fr}
 .ol-row{grid-template-columns:1fr;gap:4px}
 .ol-label{padding-top:0}
 .wrap{padding-left:14px;padding-right:14px}
 .tb-left strong,.tb-sep{display:none}
 .phase{display:none}
}
</style>
<style>.site-back{max-width:980px;margin:0 auto;padding:12px 20px 0;font-family:var(--font-ui);font-size:.95rem}.site-back a{color:var(--pen);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:.4em;padding:6px 0}.site-back a:hover{text-decoration:underline}.site-back a:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:4px}</style>
</head>

 </div>
 </div>
</div>

var TRANSCRIPTS = {"t1": [{"s": "Anna", "g": "f", "text": "Felix, hast du kurz Zeit? Ich muss mich entscheiden, welche WG-Zimmer ich mir diese Woche ansehe, und ich verliere langsam den Überblick."}, {"s": "Felix", "g": "m", "text": "Klar, zeig mal. Wie viele Angebote hast du denn?"}, {"s": "Anna", "g": "f", "text": "Vier. Kannst du mir die Anzeigen vorlesen? Dann mache ich mir Notizen."}, {"s": "Felix", "g": "m", "text": "Okay. Das erste Zimmer ist in der Südstadt, 16 Quadratmeter, mit Balkon. In der Anzeige stehen 380 Euro, aber das ist die Kaltmiete. Mit Nebenkosten sind es 420 Euro warm. Die Besichtigung ist am Montag um 18 Uhr."}, {"s": "Anna", "g": "f", "text": "Hm, das ist teurer, als ich dachte. Und das zweite?"}, {"s": "Felix", "g": "m", "text": "Das zweite ist am Hafen. 12 Quadratmeter für 390 Euro warm. Die Besichtigung sollte eigentlich am Dienstag sein, aber hier steht ein Nachtrag: Sie wurde auf Mittwoch um 19 Uhr verschoben. Und die WG sucht ausdrücklich jemanden, der nicht raucht."}, {"s": "Anna", "g": "f", "text": "Das passt, ich rauche ja nicht. Weiter?"}, {"s": "Felix", "g": "m", "text": "Das dritte ist in der Altstadt. 450 Euro warm, dafür aber 20 Quadratmeter groß und schon möbliert. Die Besichtigung ist am Donnerstag um 17 Uhr."}, {"s": "Anna", "g": "f", "text": "Zwanzig Quadratmeter klingt toll. Und das letzte?"}, {"s": "Felix", "g": "m", "text": "Das letzte ist ganz in der Nähe der Uni, 14 Quadratmeter für 360 Euro. Das Besondere: Die WG hat einen großen Garten, den alle nutzen dürfen. Die Besichtigung ist am Freitag um 19 Uhr."}, {"s": "Anna", "g": "f", "text": "Oh, ein Garten! Und das günstigste Zimmer ist es auch noch. Da gehe ich auf jeden Fall hin."}], "t2": [{"s": "Moderatorin", "g": "f", "text": "Herzlich willkommen. Jeden Tag werden in unserer Mensa Tausende Einwegbecher und Plastikverpackungen weggeworfen. Was ist zu tun? Bei mir sind Frau Doktor Hartmann, Umweltbeauftragte der Universität, und Herr Seidel, Leiter der Mensa. Frau Hartmann, was fordern Sie?"}, {"s": "Frau Hartmann", "g": "f", "text": "Ich fordere, dass Einweggeschirr in der Mensa komplett verboten wird. Es darf nur noch Mehrweggeschirr und Mehrwegbecher geben. Allein unsere Mensa füllt jeden Tag mehrere große Container mit Müll. Der größte Teil davon sind Becher und Verpackungen, die nur wenige Minuten benutzt wurden."}, {"s": "Moderatorin", "g": "f", "text": "Herr Seidel, ist ein Verbot der richtige Weg?"}, {"s": "Herr Seidel", "g": "m", "text": "Ich halte ein Verbot für zu radikal. Ich schlage stattdessen vor, alle zu belohnen, die ihren eigenen Becher mitbringen, zum Beispiel mit einem Rabatt von 30 Cent pro Getränk. Ein Verbot würde viele Gäste abschrecken. Die kaufen ihren Kaffee dann lieber beim Bäcker um die Ecke, und dort landet der Becher trotzdem im Müll. Außerdem fehlen uns für so viel Mehrweggeschirr die Spülmaschinen und das Personal."}], "t3": [{"s": "Dozentin", "g": "f", "text": "Guten Tag. Heute beschäftigen wir uns mit einem Gegenstand, den viele von Ihnen jeden Tag auf der Nase tragen: der Brille."}, {"s": "Dozentin", "g": "f", "text": "Schon in der Antike wusste man, dass geschliffene Kristalle Dinge größer erscheinen lassen. Die ersten echten Brillen tauchten aber erst gegen Ende des dreizehnten Jahrhunderts in Italien auf. Es waren zwei Linsen, die man mit der Hand vor die Augen hielt oder auf die Nase klemmte. Sie halfen vor allem älteren Menschen, die in der Nähe nicht mehr gut sehen konnten."}, {"s": "Dozentin", "g": "f", "text": "Brillen für Kurzsichtige, also für Menschen, die in der Ferne schlecht sehen, kamen deutlich später. Dafür brauchte man Linsen mit einer anderen Form, die schwieriger herzustellen waren."}, {"s": "Dozentin", "g": "f", "text": "Lange Zeit waren Brillen ein teures Luxusgut, das sich nur wenige leisten konnten. Erst im neunzehnten Jahrhundert wurden sie in großen Mengen und damit günstig produziert."}, {"s": "Dozentin", "g": "f", "text": "Heute ist Kurzsichtigkeit so verbreitet wie nie zuvor, besonders bei jungen Menschen. Fachleute vermuten, dass das weniger an den Bildschirmen selbst liegt als daran, dass Kinder zu wenig Zeit im Freien verbringen. Das Tageslicht scheint nämlich eine wichtige Rolle für die gesunde Entwicklung des Auges zu spielen."}], "t4": [{"s": "Moderatorin", "g": "f", "text": "Willkommen. Wer in Deutschland auf Deutsch studieren möchte, muss in der Regel Sprachkenntnisse auf dem Niveau C1 nachweisen. Einige Hochschulen überlegen, künftig schon das Niveau B2 zu akzeptieren. Bei mir sind Frau Doktor Yildiz, Leiterin eines Sprachenzentrums, und Herr Professor Krause, Germanist. Frau Yildiz, Sie befürworten das."}, {"s": "Frau Yildiz", "g": "f", "text": "Ja. Viele junge Menschen sind fachlich hervorragend, scheitern aber an der hohen Sprachhürde. Sie verlieren dann oft ein ganzes Jahr, nur um ein Zertifikat zu erreichen. Ich schlage vor, Studierende schon mit dem niedrigeren Niveau zuzulassen und ihnen in den ersten beiden Semestern verpflichtende Sprachkurse anzubieten. Die Sprache lernt man ohnehin am besten im Alltag an der Hochschule."}, {"s": "Moderatorin", "g": "f", "text": "Herr Krause?"}, {"s": "Herr Krause", "g": "m", "text": "Ich verstehe das Anliegen. Und es stimmt, dass man im Alltag an der Hochschule enorm viel dazulernt. Trotzdem halte ich C1 für notwendig. Wer wissenschaftliche Texte lesen und Hausarbeiten schreiben muss, braucht von Anfang an sichere Sprachkenntnisse. Sonst sind die ersten Semester eine einzige Überforderung, und die Zahl der Studienabbrüche steigt."}], "t5": [{"s": "Dozent", "g": "m", "text": "Guten Morgen. Heute beantworten wir eine Frage, die Kinder ihren Eltern gern stellen: Warum ist der Himmel eigentlich blau?"}, {"s": "Dozent", "g": "m", "text": "Das Sonnenlicht erscheint uns weiß. Tatsächlich besteht es aber aus allen Farben des Regenbogens, also aus Licht unterschiedlicher Wellenlängen. Rotes Licht hat lange Wellen, blaues Licht dagegen kurze."}, {"s": "Dozent", "g": "m", "text": "Wenn das Sonnenlicht auf die Atmosphäre trifft, stößt es auf winzige Teilchen der Luft, vor allem auf Stickstoff- und Sauerstoffmoleküle. Diese lenken das Licht in alle Richtungen ab. Man spricht von Streuung. Entscheidend ist: Kurzwelliges, also blaues Licht wird viel stärker gestreut als rotes. Deshalb kommt aus allen Richtungen des Himmels vor allem blaues Licht bei uns an."}, {"s": "Dozent", "g": "m", "text": "Man könnte nun einwenden, dass violettes Licht noch kürzere Wellen hat. Warum ist der Himmel also nicht violett? Das liegt vor allem an unseren Augen: Sie sind für Blau deutlich empfindlicher als für Violett."}, {"s": "Dozent", "g": "m", "text": "Bleibt die Frage nach dem Abendrot. Wenn die Sonne tief steht, muss ihr Licht einen viel längeren Weg durch die Atmosphäre zurücklegen. Auf dieser langen Strecke wird das blaue Licht fast vollständig herausgestreut. Übrig bleiben vor allem die roten und orangefarbenen Anteile."}], "t6": [{"s": "Referentin", "g": "f", "text": "Herzlich willkommen. In unserer Befragung von Erstsemestern gaben fast vierzig Prozent an, sich in den ersten Wochen des Studiums einsam zu fühlen. Besonders häufig betroffen waren Studierende, die für das Studium in eine neue Stadt oder ein neues Land gezogen sind. Wenn es Ihnen so geht: Sie sind damit ganz und gar nicht allein."}, {"s": "Referentin", "g": "f", "text": "Wie entstehen eigentlich Freundschaften? Ein amerikanischer Forscher hat untersucht, wie viel gemeinsame Zeit dafür nötig ist. Sein Ergebnis: Aus Fremden werden nach ungefähr fünfzig gemeinsam verbrachten Stunden lockere Freunde. Für eine enge Freundschaft braucht es sogar rund zweihundert Stunden."}, {"s": "Referentin", "g": "f", "text": "Daraus lässt sich eine wichtige Erkenntnis ableiten: Freundschaften entstehen vor allem durch regelmäßigen, wiederholten Kontakt. Ein einzelner Partyabend reicht meist nicht aus. Viel wirkungsvoller ist es, sich einer Gruppe anzuschließen, die sich jede Woche trifft, etwa einem Hochschulchor, einer Sportmannschaft oder einer Lerngruppe."}, {"s": "Referentin", "g": "f", "text": "Mein zweiter Rat: Warten Sie nicht darauf, dass andere den ersten Schritt machen. Viele Ihrer Kommilitoninnen und Kommilitonen wünschen sich genauso sehr Kontakt wie Sie, trauen sich aber ebenfalls nicht, jemanden anzusprechen."}, {"s": "Referentin", "g": "f", "text": "Und zuletzt: Haben Sie Geduld mit sich selbst. Freundschaften brauchen Zeit, und das ist völlig normal."}], "t7": [{"s": "Sprecher", "g": "m", "text": "Honig gehört zu den wichtigsten Lebensmitteln der Menschheit. Für ein einziges Glas müssen die Bienen die Blüten von mehreren Millionen Pflanzen anfliegen. Richtig gelagert, ist Honig fast unbegrenzt haltbar, weil er nur wenig Wasser enthält. Archäologen fanden in ägyptischen Gräbern sogar Honig, der nach Tausenden von Jahren noch genießbar war. Wird Honig fest, ist er übrigens nicht verdorben, sondern lässt sich langsam wieder erwärmen."}]};

function matches(val, need){ var v=norm(val); if(!v) return false; return need.every(function(r){ return r.test(v); }); }
function cur(){ return state.answers[state.idx]; }
function T(){ return TASKS[state.idx]; }
var TOTAL_ITEMS = sum(TASKS.map(function(t){ return t.items; }));

function initAnswers(){
 state.heard = [];
 state.answers = TASKS.map(function(t){
 switch(t.type){
 case 'table': return t.blanks.map(function(){ return ''; });
 case 'pair': return {f0:'',a0:'',f1:'',a1:''};
 case 'summary': return {marks:t.sentences.map(function(){ return false; }), notes:''};
 case 'persons': return t.statements.map(function(){ return null; });
 case 'outline': return t.points.map(function(){ return ''; });
 case 'mc': return t.questions.map(function(){ return null; });
 case 'diff': return [];
 }
 });
}

/* ================= Audio ================= */
var blobCache = {};
function toBlobUrl(dataUrl){
 if(dataUrl.indexOf('data:') !== 0) return dataUrl;
 if(blobCache[dataUrl]) return blobCache[dataUrl];
 var b64 = dataUrl.split(',')[1], bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
 for (var i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
 var url = URL.createObjectURL(new Blob([bytes], {type:'audio/mpeg'}));
 blobCache[dataUrl] = url; return url;
}
function unlockAudio(){
 try { player.src = SILENT; var p = player.play(); if (p && p.catch) p.catch(function(){}); player.pause(); } catch(e){}
}
function stopAudio(){
 try { player.pause(); } catch(e){}
 if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch(e){} }
 state.playing = false; state.ttsBusy = false;
}

function playTrack(onEnd){
 var t = T(), src = AUDIO[t.id].src;
 stopAudio();
 var tried = [];
 function fail(){ // last resort: browser voice
 state.audioMode = 'tts'; toast('Audiodatei nicht abspielbar. Browser-Stimme wird verwendet.');
 speakFallback(TRANSCRIPTS[t.id], onEnd);
 }
 function attempt(kind){
 tried.push(kind);
 player.onended = function(){ state.playing=false; onEnd(); };
 player.onerror = function(){
 if (tried.indexOf('blob') === -1) attempt('blob'); else fail();
 };
 player.src = (kind === 'blob') ? toBlobUrl(src) : src;
 player.currentTime = 0;
 var p = player.play();
 state.playing = true;
 if (p && p.catch) p.catch(function(err){
 if (err && err.name === 'NotAllowedError') { state.playing=false; showTapToPlay(); }
 else if (tried.indexOf('blob') === -1) attempt('blob'); else fail();
 });
 }
 attempt('data');
}

/* Fallback: improved Web Speech (only if the audio file cannot be played) */
function pickVoices(){
 var vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
 var de = vs.filter(function(v){ return /^de/i.test(v.lang); });
 var score = function(v){ var n=v.name; return (/natural|neural|online/i.test(n)?4:0)+(/google/i.test(n)?2:0)+(/premium|enhanced/i.test(n)?3:0); };
 de.sort(function(a,b){ return score(b)-score(a); });
 var fem = de.filter(function(v){ return /katja|anna|petra|marlene|vicki|helena|hedda|amala|seraphina|louisa|elke|female|frau/i.test(v.name); });
 var mal = de.filter(function(v){ return /conrad|markus|yannick|stefan|hans|killian|florian|ralf|male|mann/i.test(v.name); });
 return { f: fem[0]||de[0]||null, m: mal[0]||de[1]||de[0]||null };
}
function speakFallback(lines, onEnd){
 if (!window.speechSynthesis) { onEnd(); return; }
 var voices = pickVoices(), queue = [];
 lines.forEach(function(l){ (l.text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[l.text]).forEach(function(s){ queue.push({g:l.g, s:s.trim()}); }); });
 state.ttsBusy = true; state.playing = true;
 var i = 0;
 (function next(){
 if (!state.ttsBusy) return;
 if (i >= queue.length) { state.playing=false; state.ttsBusy=false; onEnd(); return; }
 var q = queue[i++], u = new SpeechSynthesisUtterance(q.s);
 u.lang = 'de-DE'; u.rate = 0.98; var v = q.g==='m'?voices.m:voices.f; if (v) u.voice = v;
 if (!v || voices.m === voices.f) u.pitch = q.g==='m'?0.85:1.12;
 u.onend = next; u.onerror = next;
 window.speechSynthesis.speak(u);
 })();
}

 return '<div class="sheet tbl-wrap"><table class="ov"><caption>'+t.caption+'</caption>'+

 };

 t.cats.map(function(c,k){ return '<label class="g-cell"><input type="radio" name="pers-'+i+'" value="'+k+'" data-act="pers" data-i="'+i+'"'+(a[i]===k?' checked':'')+'><span class="bubble" aria-hidden="true"></span><span class="g-lab">'+c+'</span></label>'; }).join('')+

 }).join('')+'</div></div>';
 }
 case 'mc': {
 return '<div class="sheet">'+t.questions.map(function(q,i){
 return '<div class="q" role="radiogroup" aria-labelledby="mq-'+i+'"><p class="q-stem" id="mq-'+i+'"><span class="q-n">'+(i+1)+'</span><span>'+q.stem+'</span></p>'+
 q.options.map(function(o,j){ return '<label class="opt"><input type="radio" name="mc-'+i+'" value="'+j+'" data-act="mc" data-i="'+i+'"'+(a[i]===j?' checked':'')+'><span class="bubble" aria-hidden="true"></span><span>'+o+'</span></label>'; }).join('')+'</div>';
 }).join('')+'</div>';

 words.map(function(w,i){ return '<span class="w'+(a.indexOf(i)>-1?' on':'')+'" role="button" tabindex="0" aria-pressed="'+(a.indexOf(i)>-1)+'" data-act="word" data-i="'+i+'">'+w+'</span>'; }).join(' ')+

/* ================= Phases ================= */
function stopTimer(){ if (state.timer) { clearInterval(state.timer); state.timer = null; } }
function setPhase(name, seconds){
 state.phase = name; stopTimer();
 if (seconds != null) {
 state.phaseTotal = seconds; state.phaseEnd = Date.now() + seconds*1000;
 state.timer = setInterval(tick, 250); tick();
 } else paintClock();
}
function tick(){
 var left = (state.phaseEnd - Date.now())/1000;
 paintClock(left);
 if (left <= 0) { stopTimer(); if (state.phase === 'prep') startListening(); else if (state.phase === 'post') autoNext(); }
}
function paintClock(left){
 var ph = document.getElementById('phase'), cl = document.getElementById('clock'), f = document.getElementById('curfill');
 var label = {prep:'Vorbereitung', listen:'Hörtext', post:'Bearbeitung', idle:''}[state.phase] || '';
 if (ph) ph.textContent = state.mode==='practice' ? 'Übungsmodus' : label;
 if (state.phase === 'listen') {
 var d = player.duration && isFinite(player.duration) ? player.duration : AUDIO[T().id].dur;
 left = state.audioMode==='file' ? d - player.currentTime : null;
 }
 if (cl) { cl.textContent = (left==null || state.mode==='practice') ? '' : fmt(left); cl.classList.toggle('warn', state.phase==='post' && left!=null && left<=30); }
 if (f && state.mode === 'exam') {
 var t = T(), d2 = AUDIO[t.id].dur, whole = t.prep + d2 + t.post, done = 0;
 if (state.phase === 'prep') done = t.prep - Math.max(0, left);
 else if (state.phase === 'listen') done = t.prep + (state.audioMode==='file' ? player.currentTime : d2/2);
 else if (state.phase === 'post') done = t.prep + d2 + (t.post - Math.max(0, left));
 f.style.width = Math.min(100, done/whole*100)+'%';
 }
}

function startTaskFlow(){
 var t = T();
 if (state.mode === 'exam') {
 if (t.prep > 0) { setPhase('prep', t.prep); setStatus('Lesen Sie die Aufgabe. Der Hörtext startet in '+t.prep+' Sekunden.'); }
 else startListening();
 } else { setPhase('idle', null); }
}
function setStatus(msg, live){ var s=document.getElementById('pl-status'); if(s){ s.innerHTML = msg; s.classList.toggle('live', !!live); } }
function showTapToPlay(){
 var b = document.getElementById('pl-btn'), l = document.getElementById('pl-label');
 if (b) { b.disabled = false; b.setAttribute('data-act','play'); }
 if (l) l.textContent = 'Abspielen';
 setStatus('Ihr Browser hat das automatische Abspielen blockiert. Bitte tippen Sie auf „Abspielen“.');
}
var progTimer = null;
function startListening(){
 var b = document.getElementById('pl-btn'), l = document.getElementById('pl-label');
 if (b) b.disabled = true; if (l) l.textContent = 'Läuft';
 state.phase = 'listen'; stopTimer();
 setStatus('<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span> Hörtext läuft. Sie hören den Text einmal.', true);
 clearInterval(progTimer);
 progTimer = setInterval(function(){
 var d = player.duration && isFinite(player.duration) ? player.duration : AUDIO[T().id].dur;
 var c = state.audioMode==='file' ? player.currentTime : 0;
 var fill = document.getElementById('pl-fill'), cur = document.getElementById('pl-cur');
 if (fill) fill.style.width = Math.min(100, c/d*100)+'%';
 if (cur) cur.textContent = fmt(c);
 paintClock();
 }, 250);
 playTrack(onListenEnd);
}
function onListenEnd(){
 clearInterval(progTimer);
 state.listened = true; state.heard[state.idx] = true;
 var fill = document.getElementById('pl-fill'); if (fill) fill.style.width = '100%';
 var t = T();
 if (t.type === 'summary') { var area = document.getElementById('sum-area'); if (area) area.innerHTML = summaryArea(t, cur()); }
 if (state.mode === 'exam') {
 setPhase('post', t.post);
 setStatus('Der Hörtext ist zu Ende. Sie haben jetzt '+durText(t.post)+' Zeit, um Ihre Antworten zu bearbeiten.');
 var l = document.getElementById('pl-label'); if (l) l.textContent = 'Beendet';
 } else {
 setPhase('idle', null);
 var b = document.getElementById('pl-btn'), l2 = document.getElementById('pl-label');
 if (b) b.disabled = false; if (l2) l2.textContent = 'Noch einmal hören';
 setStatus('Der Hörtext ist zu Ende. Im Übungsmodus können Sie ihn noch einmal hören.');
 }
}
function autoNext(){
 if (state.idx === TASKS.length-1) { finish(); toast('Die Zeit ist abgelaufen. Hier ist Ihr Ergebnis.'); }
 else { var n = state.idx+1; goTo(n); toast('Weiter mit Aufgabe '+(n+1)+'.'); }
}

function goTo(i){
 stopTimer(); clearInterval(progTimer); stopAudio(); closeModal(true);
 state.idx = i; state.listened = !!state.heard[i]; renderTask(); window.scrollTo(0,0); startTaskFlow();
}

/* ================= Scoring ================= */
function scoreTask(t, a){
 switch(t.type){
 case 'table': return t.blanks.filter(function(b,i){ return matches(a[i], b.need); }).length;
 case 'pair': return t.persons.reduce(function(s,p,k){ return s + (matches(a['f'+k], p.f.need)?1:0) + (matches(a['a'+k], p.a.need)?1:0); }, 0);
 case 'summary': return t.sentences.filter(function(s,i){ return s.wrong && a.marks[i]; }).length;
 case 'persons': return t.statements.filter(function(s,i){ return a[i]===s.answer; }).length;
 case 'outline': return t.points.filter(function(p,i){ return matches(a[i], p.need); }).length;
 case 'mc': return t.questions.filter(function(q,i){ return a[i]===q.answer; }).length;
 case 'diff': return t.diffs.filter(function(d){ return a.indexOf(d.i) > -1; }).length;
 }
 return 0;
}
function rv(ok, label, lines, expl){
 return '<div class="rv '+(ok?'ok':'bad')+'"><span class="rv-mark" aria-hidden="true">'+(ok?'✓':'✗')+'</span><div class="rv-body">'+
 '<p class="rv-label"><span class="sr">'+(ok?'Richtig: ':'Falsch: ')+'</span>'+label+'</p>'+lines.map(function(l){ return '<p>'+l+'</p>'; }).join('')+
 (expl?'<p class="rv-expl">'+expl+'</p>':'')+'</div></div>';
}
function yours(v){ return v && String(v).trim() ? '<strong>'+esc(v)+'</strong>' : '<em>keine Antwort</em>'; }
function reviewHTML(t, a){
 switch(t.type){
 case 'table': return '<p class="rv-note">Automatisch geprüft über Schlüsselwörter. Antworten mit derselben Bedeutung sind auch richtig.</p>'+
 t.blanks.map(function(b,i){ return rv(matches(a[i], b.need), 'Lücke '+(i+1), ['Ihre Antwort: '+yours(a[i]), 'Lösung: <strong>'+b.answer+'</strong>'], t.why[i]); }).join('');
 case 'pair': return '<p class="rv-note">Automatisch geprüft über Schlüsselwörter. Vergleichen Sie Ihre Notizen trotzdem mit der Musterlösung.</p>'+
 t.persons.map(function(p,k){
 return rv(matches(a['f'+k], p.f.need), p.name+': Forderung', ['Ihre Antwort: '+yours(a['f'+k]), 'Musterlösung: <strong>'+p.f.answer+'</strong>'])+
 rv(matches(a['a'+k], p.a.need), p.name+': Argument', ['Ihre Antwort: '+yours(a['a'+k]), 'Musterlösung: <strong>'+p.a.answer+'</strong>']);
 }).join('');
 case 'summary': return '<p class="rv-note">Punkte gibt es für jeden der zwei falschen Sätze, den Sie markiert haben.</p>'+
 t.sentences.map(function(s,i){ var ok = s.wrong ? a.marks[i] : !a.marks[i];
 return rv(ok, '„'+s.text+'“', ['Inhaltlich <strong>'+(s.wrong?'falsch':'richtig')+'</strong>. '+(a.marks[i]?'Sie haben den Satz markiert.':'Sie haben den Satz nicht markiert.')], s.why); }).join('');
 case 'persons': return t.statements.map(function(s,i){
 return rv(a[i]===s.answer, (i+1)+'. '+s.text, ['Ihre Antwort: '+(a[i]==null?'<em>keine Antwort</em>':'<strong>'+t.cats[a[i]]+'</strong>')].concat(a[i]===s.answer?[]:['Richtig: <strong>'+t.cats[s.answer]+'</strong>']), s.why); }).join('');
 case 'outline': return '<p class="rv-note">Automatisch geprüft über Schlüsselwörter. Antworten mit derselben Bedeutung sind auch richtig.</p>'+
 t.points.map(function(p,i){ return rv(matches(a[i], p.need), p.label, ['Ihre Antwort: '+yours(a[i]), 'Musterlösung: <strong>'+p.answer+'</strong>']); }).join('');
 case 'mc': return t.questions.map(function(q,i){
 return rv(a[i]===q.answer, 'Frage '+(i+1)+': '+q.stem, ['Ihre Antwort: '+(a[i]==null?'<em>keine Antwort</em>':'<strong>'+q.options[a[i]]+'</strong>')].concat(a[i]===q.answer?[]:['Richtig: <strong>'+q.options[q.answer]+'</strong>']), q.why); }).join('');
 case 'diff': {
 var words = t.written.split(/\s+/);
 var out = t.diffs.map(function(d){ var ok = a.indexOf(d.i) > -1;
 return rv(ok, 'Geschrieben: „'+words[d.i].replace(/[.,:]$/,'')+'“', ['Gehört: <strong>'+d.heard+'</strong>', ok?'Sie haben das Wort markiert.':'Sie haben das Wort nicht markiert.']); }).join('');
 var wrong = a.filter(function(i){ return !t.diffs.some(function(d){ return d.i===i; }); });
 if (wrong.length) out += '<p class="rv-note">Zusätzlich markiert, aber identisch mit dem Hörtext: '+wrong.map(function(i){ return '„'+words[i].replace(/[.,:]$/,'')+'“'; }).join(', ')+'</p>';
 return out;
 }
 }
 return '';
}
function transcriptHTML(t){
 var lines = TRANSCRIPTS[t.id];
 return '<details class="tr"><summary>Transkript anzeigen</summary>'+lines.map(function(l){
 return '<p>'+(lines.length>1 && lines.some(function(x){ return x.s!==lines[0].s; }) ? '<b>'+l.s+':</b> ' : '')+esc(l.text)+'</p>';
 }).join('')+'</details>';
}

function finish(){
 stopTimer(); clearInterval(progTimer); stopAudio(); closeModal(true);
 var scores = TASKS.map(function(t,i){ return scoreTask(t, state.answers[i]); });
 var total = sum(scores), pct = Math.round(total/TOTAL_ITEMS*100);
 var rows = TASKS.map(function(t,i){
 return '<li class="plan-row"><span class="plan-n">'+(i+1)+'</span><span class="plan-name">'+t.name+'</span><span class="plan-meta"><strong>'+scores[i]+'</strong> von '+t.items+'</span>'+
 '<span class="plan-bar" aria-hidden="true"><span style="width:'+(scores[i]/t.items*100)+'%"></span></span></li>';
 }).join('');
 var reviews = TASKS.map(function(t,i){
 return '<details class="review"'+(i===0?' open':'')+'><summary><span class="chev" aria-hidden="true">›</span><span class="rv-title">Aufgabe '+(i+1)+': '+t.name+'</span><span class="rv-score">'+scores[i]+' von '+t.items+'</span></summary>'+
 reviewHTML(t, state.answers[i])+transcriptHTML(t)+'</details>';
 }).join('');
 state.idx = -1;
 app.innerHTML = '<main class="wrap results"><header class="res-head"><h1>Ihr Ergebnis</h1>'+
 '<p class="res-score"><span class="res-num">'+total+'</span><span>von '+TOTAL_ITEMS+' Punkten, das sind '+pct+' %.</span></p>'+
 '<p class="fine">Freitext-Antworten (Aufgaben 1, 2 und 5) werden über Schlüsselwörter geprüft; bitte vergleichen Sie sie zusätzlich mit den Musterlösungen. Das Ergebnis dient nur zur Orientierung, die offiziellen TDN-Stufen berechnet das TestDaF-Institut nach einem eigenen Verfahren.</p></header>'+
 '<h2>Punkte pro Aufgabe</h2><ol class="plan-list">'+rows+'</ol><h2>Lösungen, Erklärungen und Transkripte</h2>'+reviews+
 '<div style="margin-top:32px"><button type="button" class="btn primary" data-act="restart">Zur Startseite</button></div></main>';
 window.scrollTo(0,0);
}

/* ================= Start ================= */
function renderStart(){
 var rows = TASKS.map(function(t,i){
 return '<li class="plan-row"><span class="plan-n">'+(i+1)+'</span><span class="plan-name">'+t.name+'</span><span class="plan-meta">'+t.items+' Items, Hörtext '+fmt(AUDIO[t.id].dur)+'</span></li>';
 }).join('');
 app.innerHTML = '<main class="wrap start"><header><h1>Modelltest Hören '+TEST_NO+'</h1>'+
 '<p class="lede">Eine vollständige Übungsprüfung im Format des digitalen TestDaF: 7&nbsp;Aufgaben mit '+TOTAL_ITEMS+'&nbsp;Items. Sie hören jeden Text einmal.</p></header>'+
 '<div class="note"><strong>Bitte Ton einschalten.</strong>Die Hörtexte wurden mit neuronalen Stimmen erzeugt: verständlich und natürlicher als eine Browser-Stimme, aber nicht ganz wie echte Sprecher. Kopfhörer helfen.</div>'+
 '<section aria-labelledby="plan-h"><h2 id="plan-h">Ablauf</h2><ol class="plan-list">'+rows+'</ol></section>'+
 '<section class="mode" aria-labelledby="mode-h"><h2 id="mode-h">Modus</h2>'+
 '<label class="mode-opt"><input type="radio" name="mode" value="exam"'+(state.mode==='exam'?' checked':'')+'><span class="bubble" aria-hidden="true"></span><span><strong>Prüfungsmodus</strong><small>Wie in der Prüfung: Lesezeit, der Hörtext startet automatisch und läuft einmal, danach feste Bearbeitungszeit.</small></span></label>'+
 '<label class="mode-opt"><input type="radio" name="mode" value="practice"'+(state.mode==='practice'?' checked':'')+'><span class="bubble" aria-hidden="true"></span><span><strong>Übungsmodus</strong><small>Ohne Zeitlimit. Sie starten den Hörtext selbst und können ihn wiederholen.</small></span></label>'+
 '</section><button type="button" class="btn primary" data-act="start">Test starten</button>'+
 '<p class="fine">Alle Hörtexte wurden für diese Übung neu geschrieben; Studien und Zahlen sind teilweise erfunden. In der echten Prüfung sind die Aufgaben 4 und 5 Videos. Das offizielle Format zeigt die Demo-Version auf <a href="https://www.testdaf.de" target="_blank" rel="noopener">testdaf.de</a>.</p></main>';
}

/* ================= Modal / toast ================= */
function openModal(h,p,ok,fn){
 document.getElementById('modal-h').textContent=h; document.getElementById('modal-p').textContent=p;
 var b=document.getElementById('modal-ok'); b.textContent=ok; state.modalOk=fn; state.lastFocus=document.activeElement; modal.hidden=false; b.focus();
}
function closeModal(skip){ if(modal.hidden) return; modal.hidden=true; state.modalOk=null; if(!skip&&state.lastFocus&&document.body.contains(state.lastFocus)) state.lastFocus.focus(); }
function toast(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); },3400); }

/* ================= Events ================= */
document.addEventListener('click', function(e){
 if (e.target === modal) { closeModal(); return; }
 var el = e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return;
 var act = el.getAttribute('data-act');
 switch(act){
 case 'start': {
 var m = app.querySelector('input[name="mode"]:checked'); state.mode = m ? m.value : 'exam';
 unlockAudio(); initAnswers(); state.audioMode = 'file';
 if (window.speechSynthesis) try { window.speechSynthesis.getVoices(); } catch(e){}
 goTo(0); break;
 }
 case 'play': {
 if (state.playing) return;
 if (state.mode === 'exam' && state.listened) return;
 startListening(); break;
 }
 case 'next': {
 var last = state.idx === TASKS.length-1;
 if (state.mode === 'practice') { if (last) openModal('Test auswerten?','Danach sehen Sie Ihr Ergebnis mit Lösungen und Transkripten.','Auswerten',finish); else goTo(state.idx+1); return; }
 openModal(last?'Test beenden?':'Weiter zu Aufgabe '+(state.idx+2)+'?', (state.phase==='post'?'':'Die Bearbeitungszeit läuft noch. ')+'Wie in der Prüfung können Sie danach nicht zurück.', last?'Test beenden':'Weiter', function(){ if (last) finish(); else goTo(state.idx+1); });
 break;
 }
 case 'prev': goTo(state.idx-1); break;
 case 'quit': openModal('Test beenden?','Nicht bearbeitete Items werden mit 0 Punkten gewertet.','Test beenden',finish); break;
 case 'restart': state.idx=-1; renderStart(); window.scrollTo(0,0); break;
 case 'sent': toggleSent(+el.getAttribute('data-i'), el); break;
 case 'word': toggleWord(+el.getAttribute('data-i'), el); break;
 case 'modal-ok': { var fn = state.modalOk; closeModal(true); if (fn) fn(); break; }
 case 'modal-cancel': closeModal(); break;
 }
});
function toggleSent(i, el){
 var a = cur(); if (!a.marks[i] && a.marks.filter(Boolean).length >= 2) { toast('Es sind genau zwei Sätze falsch. Heben Sie zuerst eine Markierung auf.'); return; }
 a.marks[i] = !a.marks[i]; el.classList.toggle('on', a.marks[i]); el.setAttribute('aria-pressed', String(a.marks[i]));
 var c = document.getElementById('sum-count'); if (c) c.textContent = a.marks.filter(Boolean).length+' von 2 markiert';
}
function toggleWord(i, el){
 var a = cur(), k = a.indexOf(i);
 if (k > -1) a.splice(k,1); else { if (a.length >= 4) { toast('Es sind genau vier Wörter anders. Heben Sie zuerst eine Markierung auf.'); return; } a.push(i); }
 el.classList.toggle('on', k === -1); el.setAttribute('aria-pressed', String(k === -1));
 var c = document.getElementById('diff-count'); if (c) c.textContent = a.length+' von 4 markiert';
}
document.addEventListener('input', function(e){
 var el = e.target, act = el.getAttribute && el.getAttribute('data-act'); if (!act || state.idx < 0) return;
 var a = cur();
 if (act === 'blank' || act === 'outline') a[+el.getAttribute('data-i')] = el.value;
 else if (act === 'pair') a[el.getAttribute('data-key')] = el.value;
 else if (act === 'notes') a.notes = el.value;
});
document.addEventListener('change', function(e){
 var el = e.target, act = el.getAttribute && el.getAttribute('data-act'); if (!act || state.idx < 0) return;
 var a = cur();
 if (act === 'pers' || act === 'mc') a[+el.getAttribute('data-i')] = +el.value;
});
document.addEventListener('keydown', function(e){
 if (e.key === 'Escape' && !modal.hidden) { closeModal(); return; }
 var s = e.target.closest ? e.target.closest('.sent,.w') : null;
 if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); s.click(); }
});

renderStart();
})();
</script>
<script>
(function () {
 var KEY = 'testdaf:hoeren:8', saved = false;
 function check() {
 var el = document.querySelector('.res-num');
 if (!el) { saved = false; return; }
 if (saved) return;
 var score = parseInt(el.textContent, 10), sib = el.nextElementSibling;
 var m = sib && sib.textContent.match(/von\s+(\d+)/);
 if (isNaN(score) || !m) return;
 saved = true;
 try {
 var prev = JSON.parse(localStorage.getItem(KEY) || 'null') || {};
 localStorage.setItem(KEY, JSON.stringify({
 last: score, max: +m[1], best: Math.max(score, prev.best || 0),
 runs: (prev.runs || 0) + 1, at: Date.now()
 }));
 } catch (e) {}
 }
 var app = document.getElementById('app');
 if (app && window.MutationObserver) new MutationObserver(check).observe(app, { childList: true, subtree: true });
 document.addEventListener('click', function (e) {
 var a = e.target.closest && e.target.closest('a[data-site-back]');
 if (!a) return;
 if (document.querySelector('.topbar') && !document.querySelector('.res-num') &&
 !window.confirm('Den Test wirklich verlassen? Ihre Antworten gehen dabei verloren.')) e.preventDefault();
 });
})();
</script>
</body>
</html>
